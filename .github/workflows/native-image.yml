name: Native image

# build: unprivileged (contents: read) native build and Kamal label check, for PRs, manual runs and master.
# publish: only on push to master; loads the image built above and pushes :<sha> and :latest.
# It never checks out or runs repository code, so PR code never sees a packages:write token.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Kamal service label
        run: |
          label=$(docker image inspect -f '{{index .Config.Labels "service"}}' "$IMAGE:${{ github.sha }}")
          echo "service label: '$label'"
          test "$label" = fullstack-with-spring
      - name: Smoke test native image
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE:${{ github.sha }}"
          for i in $(seq 30); do curl -fs localhost:8080/ >/dev/null && break; sleep 1; done
          for path in / /tables /forms "/lineChartComponent?name=Sales"; do
            curl -fsS -o /dev/null -w "%{http_code} $path\n" "localhost:8080$path" || { docker logs smoke | tail -40; exit 1; }
          done
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save "$IMAGE:${{ github.sha }}" | gzip > image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip -c image.tar.gz | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
